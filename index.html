async function derive(pw){const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);return crypto.subtle.deriveBits({name:'PBKDF2',salt:u8(SALT),iterations:600000,hash:'SHA-256'},km,256)}
async function open(raw){const k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(IV)},k,u8(CT));const html=new TextDecoder().decode(pt);document.open();document.write(html);document.close()}
