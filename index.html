window.addEventListener('load',()=>setTimeout(async()=>{const s=localStorage.getItem(KEYID);if(s){try{await open(u8(s))}catch{localStorage.removeItem(KEYID)}}},0));
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.textContent='Opening…';b.disabled=true;try{const raw=await derive(document.getElementById('pw').value);if(document.getElementById('rem').checked)localStorage.setItem(KEYID,btoa(String.fromCharCode(...new Uint8Array(raw))));await open(raw)}catch{document.getElementById('err').textContent='Wrong password.';b.textContent='Open';b.disabled=false}};
</script></body></html>
